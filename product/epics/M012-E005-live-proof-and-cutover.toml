[outcome]
description = "A disposable EU environment proves durable acceptance, redelivery, DLQ, BigQuery identity, scaling and rollback; production then cuts over with measured rollback safety and removes obsolete Render configuration."

[job_story]
description = "When approving production, I want live failure evidence and complete teardown, so that the new GCP path is proven rather than inferred from configuration."

[testing]
approach = "live-integration"
criteria = ["All enabled protocols match BigQuery IDs", "Writer outage redelivers", "Permanent failure reaches DLQ", "Replacement has no collection outage", "Rollback works", "Proof resources are removed"]
validator_context = ["docs/operations/gcp-proof.md", "infra/gcp/", "product/missions/M012-gcp-native-runtime.toml"]

[context]
relevant_paths = ["infra/gcp/", "docs/operations/", "docs/hosting/migration-runbook.md", "render.yaml"]
dependencies = ["M012-E003", "M012-E004", "GCP owner access", "Production DNS authority"]

[notes]
considerations = "Block truthfully when owner credentials or cutover authority are unavailable. Never replace live evidence with a local emulator claim."

