id = "M008-E002"
parent = "M008"
title = "Managed hosting proof and failure drills"
status = "complete"
created = 2026-08-20
depends_on = ["M008-E001"]

[outcome]
description = """The selected platform has a reproducible disposable deployment definition and recorded proof of HTTPS collection, sink delivery, health-gated deployment, restart behavior, rollback, centralized logs, and notifications."""

[job_story]
description = """When trusting a managed host with collector traffic, I want its automation exercised in a disposable environment, so that the recommendation is based on observed behavior rather than marketing claims."""

[testing]
approach = "live-proof"
criteria = [
    "Deployment assets pin configuration and health behavior without a VM or reverse proxy",
    "A synthetic event reaches a non-production sink over the public HTTPS endpoint",
    "Failed deployment, restart, rollback, logs, and notification behavior are recorded from a live proof",
    "Proof limitations and event-loss windows are explicit",
]
validator_context = ["render.yaml", "docs/hosting/proof-plan.md", "docs/hosting/proof-results.md"]

[context]
relevant_paths = ["Dockerfile", ".github/workflows/release.yml", "config.prod.example.yaml", "cmd/straumheim/main.go"]
dependencies = ["Access to selected platform", "A disposable sink or platform-persisted debug destination", "A notification destination"]

[notes]
considerations = """Do not use production traffic or perform DNS cutover. Block live stories with exact missing access rather than fabricating results."""

estimated_stories = 4

[execution]
completed = 2026-08-21
evidence = "A disposable Frankfurt Free service validated HTTPS collection, centralized delivery logs, failed-candidate isolation, automatic health recovery, graceful drain, rollback, cold start, and operator email notification. The service was deleted after evidence capture. Production is configured for two Starter instances at $14/month to retain a healthy peer during replacement."
