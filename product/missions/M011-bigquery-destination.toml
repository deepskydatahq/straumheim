[notes]
considerations = """
Direct BigQuery is the recommended primary path for this small tracking setup:
- events are queryable with low latency and no scheduled load pipeline;
- the Storage Write API is Google's recommended ingestion path for new projects;
- the default stream supports continuous at-least-once appends without coordinating
  committed-stream offsets between two Render instances;
- stable core columns plus BigQuery JSON payloads avoid dynamic ALTER TABLE work for
  every tracking property;
- Application Default Credentials work with a Render-mounted service-account file.

Cloud Storage remains valuable later as a cheap immutable archive/replay source, but
it is not the simplest primary analytics destination. GCS JSONL/Parquet would require
object rotation, small-file control, schema/load or external-table management, and
would delay query availability. Capture that as a separate future mission if archive
and replay become priorities.

Reliability boundary: the Storage Write API can retry transport operations, but the
current in-memory buffer can still lose acknowledged records if an instance dies.
Do not claim exactly-once delivery. Use Record ID for downstream deduplication and
complete M009 for durable acceptance/retry guarantees.

Initial official references (revalidate during execution):
- Storage Write API overview and stream semantics:
  https://cloud.google.com/bigquery/docs/write-api
- Go managed writer and gRPC guidance:
  https://cloud.google.com/bigquery/docs/write-api-streaming
- BigQuery JSON data type:
  https://cloud.google.com/bigquery/docs/json-data
- Application Default Credentials:
  https://cloud.google.com/docs/authentication/application-default-credentials
- Loading newline-delimited JSON from Cloud Storage (rejected primary alternative):
  https://cloud.google.com/bigquery/docs/loading-data-cloud-storage-json

Recommended table shape:
- id STRING NOT NULL
- timestamp TIMESTAMP NOT NULL
- received_at TIMESTAMP
- device_time TIMESTAMP
- protocol/source/schema/vendor/schema_version STRING
- is_valid BOOL
- ip/user_agent/referer STRING
- payload JSON
- flattened JSON

Partition by DATE(timestamp) and cluster by protocol/source when table creation APIs
support those options cleanly. Keep dataset creation explicit so location and billing
choices are never inferred by the collector.
"""
