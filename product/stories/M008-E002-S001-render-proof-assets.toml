[handoff]
implementation_hints = "Use runtime docker from this repository for CI-gated automatic deploys. Set STRAUMHEIM_CONFIG to /etc/secrets/config.yaml and document a stdout-only proof config."
reference_files = ["docs/hosting/decision.md"]

[execution]
completed = 2026-08-20
evidence = "render.yaml validates against the official schema; Docker builds with a 1.055 MB context; both the default /etc/straumheim/config.yaml mount and Render STRAUMHEIM_CONFIG=/etc/secrets/config.yaml override pass local health checks. A temporary free-tier variant also validates after omitting the paid-only shutdown-delay field."
