[outcome]
description = "Provide a validated Render Blueprint and proof procedure for an EU Starter web service with managed health checks, graceful shutdown, configuration, and centralized debug delivery."

[acceptance_criteria]
executable = true

[[acceptance_criteria.criteria]]
test = "configuration"
description = "render.yaml defines a Frankfurt Docker web service on Starter with /health checks and a bounded graceful shutdown"

[[acceptance_criteria.criteria]]
test = "security"
description = "No credential value is committed and runtime config is supplied through Render secret-file handling"

[[acceptance_criteria.criteria]]
test = "document"
description = "docs/hosting/proof-plan.md gives reproducible setup, synthetic event, failed deploy, restart, rollback, log, notification, cleanup, and evidence-capture steps"

[[acceptance_criteria.criteria]]
test = "validation"
description = "render.yaml parses and validates against the published Render Blueprint schema"

[context]
relevant_paths = ["render.yaml", "docs/hosting/proof-plan.md", "Dockerfile", "config.prod.example.yaml"]
input_fixtures = []
