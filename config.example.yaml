# Straumheim configuration
# Environment variables can be referenced with ${VAR} syntax.

server:
  host: 0.0.0.0
  port: 8080
  # GET /metrics serves Prometheus text format metrics for pipeline health.
  # Scrape with Prometheus at http://<host>:<port>/metrics

inputs:
  webhook:
    enabled: true
    path: /webhook

  # Snowplow tracker protocol — GET /sp/i (pixel) and POST /sp/tp2 (batch).
  # Compatible with Snowplow JS, iOS, Android, and GTM tracker SDKs.
  snowplow:
    enabled: false
    snowplow:
      cookie:
        enabled: false       # enable first-party cookie for network_userid tracking
        name: sp             # cookie name (default: sp)
        domain: ""           # cookie domain, empty = browser auto-detects
        ttl: 8760h           # cookie TTL (default: 1 year / 8760h)

  # Pixel input — 1x1 transparent GIF endpoint for email/AMP tracking.
  # Query parameters become payload fields. Off by default.
  pixel:
    enabled: false
    path: /px

buffer:
  type: memory          # memory (default)
  capacity: 10000       # max buffered records
  flush_interval: 5s    # flush after this duration
  flush_count: 500      # flush after this many records

sinks:
  # Postgres sink — writes records via COPY batching with auto-schema.
  - name: warehouse
    type: postgres
    mode: batch
    dsn: ${POSTGRES_DSN}
    table: events
    batch_size: 1000
    flush_interval: 10s
    auto_schema: true

  # ClickHouse sink — writes records via HTTP interface using JSONEachRow format.
  # Auto-creates table with MergeTree engine and auto-adds columns for new fields.
  - name: analytics
    type: clickhouse
    mode: batch
    endpoint: http://localhost:8123     # ClickHouse HTTP interface endpoint
    database: default                   # database name (default: default)
    table: events                       # table name (default: events)
    username: default                   # HTTP Basic Auth username (optional)
    password: ${CLICKHOUSE_PASSWORD}    # HTTP Basic Auth password (optional, use env var)
    batch_size: 1000
    flush_interval: 10s
    auto_schema: true

  # File sink — writes records as JSONL files with time-based rotation.
  # Useful for offline analysis with DuckDB, grep, or any JSONL-compatible tool.
  - name: archive
    type: file
    mode: batch
    output_dir: /var/lib/straumheim/events  # directory for JSONL files (created automatically)
    rotation_interval: 5m                   # rotate to a new file after this duration (default: 5m)

  # Stdout sink — prints each record as a JSON line (useful for debugging).
  - name: debug
    type: stdout
    mode: stream
