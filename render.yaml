services:
  - type: web
    name: straumheim-proof
    runtime: docker
    plan: starter
    region: frankfurt
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    numInstances: 2
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: "8080"
      - key: STRAUMHEIM_CONFIG
        value: /etc/secrets/config.yaml
