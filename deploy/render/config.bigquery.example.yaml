# Render BigQuery destination configuration.
# Supply destination identifiers as Render environment variables.
# Mount the GCP service-account JSON separately at:
# /etc/secrets/gcp-service-account.json
server:
  host: 0.0.0.0
  port: 8080
  cors:
    allowed_origins:
      - "*"

inputs:
  webhook:
    enabled: true
    path: /webhook
  snowplow:
    enabled: false
  pixel:
    enabled: false

buffer:
  type: memory
  capacity: 10000
  flush_interval: 5s
  flush_count: 500

sinks:
  - name: warehouse
    type: bigquery
    mode: batch
    project: ${BIGQUERY_PROJECT}
    dataset: ${BIGQUERY_DATASET}
    table: ${BIGQUERY_TABLE}
    location: ${BIGQUERY_LOCATION}
    max_inflight_requests: 1
